# SimPosture target profiles (v0) — the full-score angle band per vehicle
# class and measure, in degrees. Single source of truth for the app at
# runtime (ADR-0005); the values mirror docs/ZIELPROFILE.md section 3 —
# keep both in sync. Format: CLASS.MEASURE = min..max
#
# The plain lines are the seat mounted LEVEL, with an adjustable backrest —
# every rig guide the bands come from describes that build. A line prefixed
# TILTED. overrides one band for an angle-adjustable mount, where the base
# tilts with the seat (F-074, ZIELPROFILE 3.1). Only what genuinely differs
# is listed; everything else falls back to the level value.
#
# Both edges are inclusive, and the rating compares whole degrees — a posture
# measured at exactly the edge still scores the full ten (ZIELPROFILE
# section 4, "Auflösung der Bewertung").
#
# HEAD_BALANCE carries the SAME band in every class (F-075). How a head is
# carried follows from gravity and muscle load, not from the type of car — it is
# measured against the vertical, so nothing about it moves when the backrest
# does. The value is repeated per class rather than written once because the
# line format is CLASS.MEASURE throughout (ADR-0005) and stays that way; a test
# asserts the five stay equal.

STREET.TORSO_LEAN = 10..20
STREET.HIP_ANGLE = 95..110
STREET.KNEE_ANGLE = 115..135
STREET.ELBOW_ANGLE = 100..125
STREET.HEAD_BALANCE = -10..15
STREET.SHOULDER_ANGLE = 45..60

GT.TORSO_LEAN = 20..30
GT.HIP_ANGLE = 98..112
GT.KNEE_ANGLE = 120..135
GT.ELBOW_ANGLE = 90..115
GT.HEAD_BALANCE = -10..15
GT.SHOULDER_ANGLE = 42..58

# Prototype and formula have no sourced level row; theirs is transferred from
# what GT3's two independently derived rows show (ZIELPROFILE 3.1): a level
# mount moves the balanced operating point by 15 degrees of thigh inclination,
# absorbed two-to-one — lean down 10, hip open 5. The wider hip band is the
# room that trade-off needs.
#
# Prototype's tilted row is itself interpolated between GT3 and formula, so its
# level row is a derivation of a derivation. Its shoulder band stays the same in
# both rows: the reclining classes anchor the wheel against the body, and a body
# angle does not travel when the torso rotates.
PROTOTYPE.TORSO_LEAN = 24..35
PROTOTYPE.HIP_ANGLE = 100..111
PROTOTYPE.KNEE_ANGLE = 120..135
PROTOTYPE.ELBOW_ANGLE = 90..110
PROTOTYPE.HEAD_BALANCE = -10..15
PROTOTYPE.SHOULDER_ANGLE = 45..56

FORMULA.TORSO_LEAN = 28..40
FORMULA.HIP_ANGLE = 100..113
FORMULA.KNEE_ANGLE = 124..139
FORMULA.ELBOW_ANGLE = 85..105
FORMULA.HEAD_BALANCE = -10..15
FORMULA.SHOULDER_ANGLE = 47..57

RALLY.TORSO_LEAN = 5..15
RALLY.HIP_ANGLE = 90..105
RALLY.KNEE_ANGLE = 110..130
RALLY.ELBOW_ANGLE = 80..100
RALLY.HEAD_BALANCE = -10..15
RALLY.SHOULDER_ANGLE = 55..70

# --- Angle-adjustable mount (F-074) ---
#
# GT3 from a works driver's rig, transcript in docs/quellen. Derived from the
# source's most robust statement — "my heels are in line with my butt", plus the
# knee angle he gives in our own terms — rather than from its seat-surface
# angles, which never state what they are measured against (ZIELPROFILE 3.1).
# That puts the ankle level with the hip and the thigh at 25 degrees, and the
# lean follows from the identity.
#
# Only lean, hip and wheel height differ; knee, elbow and head balance hang off
# pedals, wheel and gravity, not off the mount.
#
# The shoulder band is defined at the lean band's midpoint and has to travel
# with it: same steering axis corridor as the level row (7-23 degrees above the
# horizontal, the driver runs 14), shifted by the difference between the two
# lean midpoints. Demanding a tighter mounting of one mount type than of the
# other would be arbitrary — the wheel does not care how the seat is bolted.
#
# Prototype and formula carry the sourced values here — cockpit cross-sections
# of rigid shells in tilted brackets. Their shoulder bands need no override.
#
# No overrides for street and rally: an upright class does not change its target
# when the mount can tilt, it simply sets the mount flat (ZIELPROFILE 3.1).

TILTED.GT.TORSO_LEAN = 30..40
TILTED.GT.HIP_ANGLE = 95..105
TILTED.GT.SHOULDER_ANGLE = 32..48

TILTED.PROTOTYPE.TORSO_LEAN = 34..45
TILTED.PROTOTYPE.HIP_ANGLE = 95..106

TILTED.FORMULA.TORSO_LEAN = 38..50
TILTED.FORMULA.HIP_ANGLE = 95..108
